name: speech-analysis-engine

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-host-access: &host-access
  - "host.docker.internal:host-gateway"

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

services:
  fetcher:
    image: speech-analysis-engine/fetcher:${VERSION}
    restart: unless-stopped
    user: "${RUN_AS}"
    logging: *logging
    extra_hosts: *host-access
    volumes:
      - ${DATA_DIR}:/data
      - ${SECRETS_DIR}:/secrets:ro
      - ${LOGS_DIR}:/logs
      - ${CONFIGS_DIR}/fetcher:/configs:ro

  pipeline:
    image: speech-analysis-engine/pipeline:${VERSION}
    restart: unless-stopped
    user: "${RUN_AS}"
    logging: *logging
    extra_hosts: *host-access
    volumes:
      - ${DATA_DIR}:/data
      - ${MODELS_DIR}:/models:ro
      - ${SECRETS_DIR}:/secrets:ro
      - ${LOGS_DIR}:/logs
      - ${CONFIGS_DIR}/pipeline:/configs:ro

  webui:
    image: speech-analysis-engine/webui:${VERSION}
    restart: unless-stopped
    logging: *logging
    extra_hosts: *host-access
    ports:
      - "${WEBUI_PORT}:${WEBUI_PORT}"
    volumes:
      - ${DATA_DIR}:/data:ro
      - ${SECRETS_DIR}:/secrets:ro
      - ${LOGS_DIR}:/logs
      - ${CONFIGS_DIR}/webui:/configs:ro
