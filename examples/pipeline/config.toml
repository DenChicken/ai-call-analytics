[paths]
data_dir = "/data"
models_dir = "/models"
secrets_dir = "/secrets"
logs_dir = "/logs"
configs_dir = "/configs"

[database]
dsn_file = "database_dsn"
connect_timeout = 10
max_retries = 5
backoff_base_seconds = 2
backoff_max_seconds = 60

[license]
file = "license.txt"

[storage]
done_dir = "done"

[worker]
poll_interval_seconds = 15
max_attempts = 3
stale_claim_seconds = 3600

[criteria]
file = "criteria.toml"

[types]
file = "types.toml"

[asr]
repo_id = "Systran/faster-whisper-small"
local_dir = "faster-whisper-small"
device = "cpu"
compute_type = "float32"
unload_after = false

[asr.transcript]
language = "ru"
beam_size = 5
condition_on_previous_text = true
hallucination_silence_threshold = 2.0
word_timestamps = true
vad_filter = true
min_silence_duration_ms = 300
speech_pad_ms = 400

[llm]
repo_id = "Qwen/Qwen3-0.6B"
local_dir = "Qwen3-0.6B"
device = "cpu"
torch_dtype = "float32"
load_in_4bit = false
max_input_tokens = 32000
temperature = 0.7
top_p = 0.8
top_k = 20
unload_after = false

[llm.output]
list_items = 3
max_new_tokens = 2048
timeout_seconds = 300

[prompt]
label = "v3"
system_file = "prompts/system.txt"
user_file = "prompts/user.txt"

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
