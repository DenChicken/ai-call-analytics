[paths]
data_dir = "/data"
models_dir = "/models"
secrets_dir = "/secrets"
logs_dir = "/logs"
configs_dir = "/configs"

[database]
dsn_file = "database_dsn"
connect_timeout = 10
max_retries = 5
backoff_base_seconds = 2
backoff_max_seconds = 60

[license]
file = "license.txt"

[storage]
done_dir = "done"

[worker]
poll_interval_seconds = 15
max_attempts = 3

[criteria]
file = "criteria.toml"

[types]
file = "types.toml"

[asr]
repo_id = "deepdml/faster-whisper-large-v3-turbo-ct2"
local_dir = "faster-whisper-large-v3-turbo-ct2"
device = "cpu"
compute_type = "int8"
unload_after = false

[asr.transcript]
language = "ru"
beam_size = 5
condition_on_previous_text = true
hallucination_silence_threshold = 2.0
word_timestamps = true
vad_filter = true
min_silence_duration_ms = 300
speech_pad_ms = 400

[llm]
repo_id = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
model_file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
gpu_layers = "none"
context_tokens = 8192
batch_tokens = 256
threads = 8
flash_attention = true
kv_cache_type = "int8"
offload_kv_cache = true
unload_after = false

[llm.sampling]
temperature = 0
top_p = 0.8
top_k = 20
min_p = 0.0
repeat_penalty = 1.05
seed = 0

[llm.output]
list_items = 3
max_tokens = 1024

[prompt]
label = "v1"
system_file = "prompts/system.txt"
user_file = "prompts/user.txt"

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
