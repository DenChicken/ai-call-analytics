[paths]
data_dir = "/data"
secrets_dir = "/secrets"
logs_dir = "/logs"

[database]
dsn_file = "database_dsn"

[license]
file = "license.txt"

[server]
frontend_port = 3000
backend_port = 8000
backend_path = ""

[display]
refresh_seconds = 5
page_size = 25
queue_size = 10

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
