[paths]
data_dir = "/data"
secrets_dir = "/secrets"
logs_dir = "/logs"

[database]
dsn_file = "database_dsn"
connect_timeout = 10
max_retries = 5
backoff_base_seconds = 2
backoff_max_seconds = 60

[license]
file = "license.txt"

[storage]
pending_dir = "pending"
temp_dir = "temp"

[fetch]
interval_seconds = 30
min_call_duration_seconds = 90
max_call_duration_seconds = 3600
initial_lookback_days = 7
max_records_per_cycle = 100
download_cooldown_seconds = 0

[network]
connect_timeout = 5
read_timeout = 20
download_timeout = 120
max_retries = 5
backoff_base_seconds = 1
backoff_max_seconds = 30
requests_per_second = 2

[[source]]
name = "crm_main"
kind = "bitrix24"
portal_url = "https://example.bitrix24.ru"
rest_url_file = "crm_main_rest_url"

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
