[paths]
data_dir = "C:/projects/ai-call-analytics/data"
secrets_dir = "C:/projects/ai-call-analytics/secrets"
logs_dir = "C:/projects/ai-call-analytics/logs"

[database]
dsn_file = "database_dsn"

[license]
file = "license.txt"

[server]
frontend_port = 3000
backend_port = 8000
backend_path = ""

[session]
max_age_seconds = 604800
cookie_secure = false

[display]
timezone = "Asia/Tbilisi"
refresh_seconds = 5
page_size = 25
queue_size = 10

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
