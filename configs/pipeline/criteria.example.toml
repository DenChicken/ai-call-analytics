[[criterion]]
code = "greeting"
label = "Приветствие и установление контакта"
description = "Менеджер поздоровался, представился по имени и назвал компанию в начале разговора."

[[criterion]]
code = "needs_identification"
label = "Выявление потребностей"
description = "Менеджер задавал вопросы, чтобы понять задачу и ситуацию клиента, а не сразу перешёл к презентации."

[[criterion]]
code = "objection_handling"
label = "Работа с возражениями"
description = "Менеджер выслушал сомнения клиента и ответил на них по существу, без давления и игнорирования."

[[criterion]]
code = "closing_deal"
label = "Завершение сделки"
description = "Менеджер зафиксировал следующий шаг: договорённость о встрече, звонке, счёте или отправке материалов."
