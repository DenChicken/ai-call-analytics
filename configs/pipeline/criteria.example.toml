[[criteria]]
code = "greeting"
title = "Приветствие и установление контакта"
prompt = "Менеджер поздоровался, представился и назвал компанию"

[[criteria]]
code = "needs_identification"
title = "Выявление потребностей"
prompt = "Менеджер задавал вопросы, чтобы понять задачу клиента"

[[criteria]]
code = "objection_handling"
title = "Работа с возражениями"
prompt = "Менеджер отработал возражения клиента, а не проигнорировал их"

[[criteria]]
code = "closing_deal"
title = "Завершение сделки"
prompt = "Менеджер зафиксировал следующий шаг: счёт, встреча или повторный звонок"
