[[criterion]]
code = "contact_initiation"
label = "Контакт и начало разговора"
description = "Менеджер поздоровался, назвал компанию и свое имя."

[[criterion]]
code = "client_qualification"
label = "Квалификация клиента"
description = "Менеджер спрашивает про город, бюджет, сферу бизнеса или параметры клиента."

[[criterion]]
code = "request_understanding"
label = "Понимание / формирование запроса"
description = "Менеджер уточняет конкретные характеристики, объем, цвет или модель товара."

[[criterion]]
code = "client_pain"
label = "Понимание боли клиента"
description = "Менеджер спрашивает о прошлых проблемах, срочности или целях покупки."

[[criterion]]
code = "quality_presentation"
label = "Качественная презентация"
description = "Менеджер подробно описывает свойства продукта, выгоды и условия работы."

[[criterion]]
code = "objection_handling"
label = "Отработка возражений"
description = "Менеджер отвечает на сомнения клиента про дороговизну, сомнения или сроки."

[[criterion]]
code = "purchase_offer"
label = "Предложение о покупке"
description = "Менеджер предлагает оформить заказ, купить товар или выставить счет."

[[criterion]]
code = "call_closing"
label = "Закрытие звонка / договорённость"
description = "Менеджер утверждает дату следующего созвона или отправку материалов."

[[criterion]]
code = "cross_selling"
label = "Кросс-продажа / расширение запроса"
description = "Менеджер предлагает сопутствующие товары, аксессуары или дополнительные услуги."

[[criterion]]
code = "hover_offer"
label = "Предложение Ховера"
description = "Менеджер произносит слово Ховер, Hover или предлагает этот бренд."

[[criterion]]
code = "overall_assessment"
label = "Общая оценка звонка"
description = "Менеджер вежлив, говорит внятно, не перебивает и ведет диалог."

[[criterion]]
code = "conversation_management"
label = "Управление разговором"
description = "Менеджер сам задает вопросы после ответов клиента и держит инициативу."

[[criterion]]
code = "meeting_invitation"
label = "Приглашение на встречу"
description = "Менеджер зовет клиента приехать в офис, шоурум или на онлайн-демонстрацию."
