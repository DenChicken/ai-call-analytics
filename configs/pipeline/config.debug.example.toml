[database]
dsn_file = "./secrets/database_dsn"

[storage]
done_dir = "./data/done"

[worker]
count = 1
poll_interval_seconds = 15
max_attempts = 1

[criteria]
file = "./configs/pipeline/criteria.example.toml"

[models]
hf_token_file = "./secrets/hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "./models/faster-whisper-large-v3"
device = "cpu"
compute_type = "int16"
language = "ru"
beam_size = 1
vad_filter = true

[diarization]
repo_id = "pyannote/speaker-diarization-3.1"
local_dir = "./models/pyannote-speaker-diarization-3.1"
device = "cpu"
max_speakers = 2

[llm]
repo_id = "Qwen/Qwen3-1.7B"
local_dir = "./models/Qwen3-1.7B"
device = "cpu"
torch_dtype = "float32"
load_in_4bit = false
max_input_tokens = 8000
max_new_tokens = 768
temperature = 0.3

[prompt]
label = "v1"
system_file = "./configs/pipeline/prompts/system-example.txt"
user_file = "./configs/pipeline/prompts/user-example.txt"

[logging]
level = "DEBUG"
dir = "./logs"
external_logs = false
external_level = "WARNING"
