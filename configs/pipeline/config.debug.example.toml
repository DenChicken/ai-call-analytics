[database]
dsn_file = "./secrets/database_dsn"

[storage]
done_dir = "./data/done"

[worker]
count = 1
poll_interval_seconds = 15
max_attempts = 1

[criteria]
file = "./configs/pipeline/criteria.example.toml"

[models]
hf_token_file = "./secrets/hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "./models/faster-whisper-large-v3"
device = "cpu"
compute_type = "int8"
language = "ru"
beam_size = 1
min_silence_duration_ms = 350
unload_after = true

[roles_llm]
repo_id = "Qwen/Qwen3-1.7B"
local_dir = "./models/Qwen3-1.7B"
device = "cpu"
torch_dtype = "float32"
load_in_4bit = false
max_input_tokens = 16000
max_new_tokens = 4096
temperature = 0.0
top_p = 0.8
top_k = 20
unload_after = true

[analysis_llm]
repo_id = "Qwen/Qwen3-4B-Instruct-2507"
local_dir = "./models/Qwen3-4B-Instruct-2507"
device = "cpu"
torch_dtype = "float32"
load_in_4bit = false
max_input_tokens = 16000
max_new_tokens = 2048
temperature = 0.7
top_p = 0.8
top_k = 20
unload_after = true

[prompt]
label = "v1"
roles_system_file = "./configs/pipeline/prompts/roles-system-example.txt"
roles_user_file = "./configs/pipeline/prompts/roles-user-example.txt"
analysis_system_file = "./configs/pipeline/prompts/analysis-system-example.txt"
analysis_user_file = "./configs/pipeline/prompts/analysis-user-example.txt"

[logging]
level = "DEBUG"
dir = "./logs"
external_logs = false
external_level = "WARNING"
