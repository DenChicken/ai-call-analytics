[database]
dsn_file = "./secrets/database_dsn"

[storage]
done_dir = "./data/done"

[worker]
count = 1
poll_interval_seconds = 15
max_attempts = 1

[criteria]
file = "./configs/pipeline/criteria.example.toml"

[types]
file = "./configs/pipeline/types.example.toml"

[huggingface]
token_file = "./secrets/hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "./models/faster-whisper-large-v3"
device = "cpu"
compute_type = "int8"
unload_after = true

[asr.transcript]
language = "ru"
beam_size = 5
condition_on_previous_text = true
hallucination_silence_threshold = 2.0
word_timestamps = true
vad_filter = true
min_silence_duration_ms = 300
speech_pad_ms = 400
break_silence_ms = 250

[llm]
repo_id = "Qwen/Qwen3-1.7B"
local_dir = "./models/Qwen3-1.7B"
device = "cpu"
torch_dtype = "bfloat16"
load_in_4bit = false
max_input_tokens = 16000
temperature = 0.7
top_p = 0.8
top_k = 20
unload_after = true

[llm.output]
list_items = 3
max_new_tokens = 2048
timeout_seconds = 900

[prompt]
label = "v3"
system_file = "./configs/pipeline/prompts/system-example.txt"
user_file = "./configs/pipeline/prompts/user-example.txt"

[logging]
level = "DEBUG"
dir = "./logs"
external_logs = false
external_level = "WARNING"
