label = "Продажа"
description = "Разговор менеджера с КЛИЕНТОМ или потенциальным клиентом: обсуждение товара, услуги, заказа, цены, сроков или условий покупки. Клиент находится на линии."

[[type]]
code = "not_sales"
label = "Не продажа"
description = "Автоответчик, гудки, тишина, личный разговор, приветствие без продолжения, А ТАКЖЕ рабочий разговор двух сотрудников компании между собой: обсуждение остатков, поставок, цен для своих, третьего клиента, поиск контактов коллег. Признаки: собеседники обращаются друг к другу по имени без представления, говорят «мы» об одной компании, обсуждают клиента в третьем лице."
