[paths]
data_dir = "C:/projects/ai-call-analytics/data"
models_dir = "C:/projects/ai-call-analytics/models"
secrets_dir = "C:/projects/ai-call-analytics/secrets"
logs_dir = "C:/projects/ai-call-analytics/logs"

[database]
dsn_file = "database_dsn"

[storage]
done_dir = "done"

[worker]
poll_interval_seconds = 15
max_attempts = 3
stale_claim_seconds = 3600

[criteria]
file = "criteria.example.toml"

[types]
file = "types.example.toml"

[huggingface]
token_file = "hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "faster-whisper-large-v3"
device = "cuda"
compute_type = "float16"
unload_after = false

[asr.transcript]
language = "ru"
beam_size = 5
condition_on_previous_text = true
hallucination_silence_threshold = 2.0
word_timestamps = true
vad_filter = true
min_silence_duration_ms = 300
speech_pad_ms = 400

[llm]
repo_id = "Qwen/Qwen3-4B-Instruct-2507"
local_dir = "Qwen3-4B-Instruct-2507"
device = "cuda"
torch_dtype = "bfloat16"
load_in_4bit = false
max_input_tokens = 32000
temperature = 0.7
top_p = 0.8
top_k = 20
unload_after = false

[llm.output]
list_items = 3
max_new_tokens = 2048
timeout_seconds = 600

[prompt]
label = "v3"
system_file = "prompts/system-example.txt"
user_file = "prompts/user-example.txt"

[logging]
level = "INFO"
external_logs = false
external_level = "WARNING"
