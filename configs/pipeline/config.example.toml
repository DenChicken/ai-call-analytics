[database]
dsn_file = "./secrets/database_dsn"

[storage]
done_dir = "./data/done"

[worker]
count = 1
poll_interval_seconds = 15
max_attempts = 3

[criteria]
file = "./configs/pipeline/criteria.toml"

[models]
hf_token_file = "./secrets/hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "./models/faster-whisper-large-v3"
device = "cuda"
compute_type = "float16"
language = "ru"
beam_size = 5
vad_filter = true

[roles_llm]
repo_id = "Qwen/Qwen3-8B"
local_dir = "./models/Qwen3-8B"
device = "cuda"
torch_dtype = "bfloat16"
load_in_4bit = true
max_input_tokens = 24000
max_new_tokens = 4096
temperature = 0.0

[analysis_llm]
repo_id = "Qwen/Qwen3-8B"
local_dir = "./models/Qwen3-8B"
device = "cuda"
torch_dtype = "bfloat16"
load_in_4bit = true
max_input_tokens = 24000
max_new_tokens = 2048
temperature = 0.3

[prompt]
label = "v1"
roles_system_file = "./configs/pipeline/prompts/roles-system-example.txt"
roles_user_file = "./configs/pipeline/prompts/roles-user-example.txt"
analysis_system_file = "./configs/pipeline/prompts/analysis-system-example.txt"
analysis_user_file = "./configs/pipeline/prompts/analysis-user-example.txt"

[logging]
level = "DEBUG"
dir = "./logs"
external_logs = false
external_level = "WARNING"
