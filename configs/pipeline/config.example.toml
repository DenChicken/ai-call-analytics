[database]
dsn_file = "./secrets/database_dsn"

[storage]
done_dir = "./data/done"

[worker]
count = 1
poll_interval_seconds = 15
max_attempts = 3

[criteria]
file = "./configs/pipeline/criteria.toml"

[models]
hf_token_file = "./secrets/hf_token"

[asr]
repo_id = "Systran/faster-whisper-large-v3"
local_dir = "./models/faster-whisper-large-v3"
device = "cuda"
compute_type = "float16"
language = "ru"
beam_size = 5
min_silence_duration_ms = 350
unload_after = false

[roles_llm]
repo_id = "Qwen/Qwen3-4B-Instruct-2507"
local_dir = "./models/Qwen3-4B-Instruct-2507"
device = "cuda"
torch_dtype = "bfloat16"
load_in_4bit = false
max_input_tokens = 32000
max_new_tokens = 8192
temperature = 0.0
top_p = 0.8
top_k = 20
unload_after = false

[analysis_llm]
repo_id = "Qwen/Qwen3-4B-Instruct-2507"
local_dir = "./models/Qwen3-4B-Instruct-2507"
device = "cuda"
torch_dtype = "bfloat16"
load_in_4bit = false
max_input_tokens = 32000
max_new_tokens = 2048
temperature = 0.7
top_p = 0.8
top_k = 20
unload_after = false

[prompt]
label = "v1"
roles_system_file = "./configs/pipeline/prompts/roles-system-example.txt"
roles_user_file = "./configs/pipeline/prompts/roles-user-example.txt"
analysis_system_file = "./configs/pipeline/prompts/analysis-system-example.txt"
analysis_user_file = "./configs/pipeline/prompts/analysis-user-example.txt"

[logging]
level = "INFO"
dir = "./logs"
external_logs = false
external_level = "WARNING"
